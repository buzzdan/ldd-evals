version: '3'

# The Go suite. Paths are relative to the repository root, where task runs.
# OUT names a run directory; each tier writes to OUT/<tier> so one directory
# can hold a cheap and a medium run side by side, which is how a baseline is
# laid out.

vars:
  # The plugin directory this run measures: PLUGIN=<dir> on the command line,
  # else the Go plugin in a sibling checkout of buzzdan/ai-coding-rules.
  PLUGIN: '{{.PLUGIN | default (printf "%s/../ai-coding-rules/go-linter-driven-development" .ROOT_DIR)}}'
  TIER: '{{.TIER | default "cheap"}}'
  CAP: '{{.CAP | default "60"}}'
  OUT: '{{.OUT | default (now | date "20060102-150405" | printf "results/go-%s")}}'
  # Optional glob over case names, forwarded as --case.
  CASE: '{{.CASE | default ""}}'
  CASE_FLAG: '{{if .CASE}}--case {{.CASE | shellQuote}}{{end}}'
  # RESUME=1 reuses every run under OUT/<TIER> that already has a result.json.
  RESUME_FLAG: '{{if .RESUME}}--resume{{end}}'
  EVALS_DIR: '{{.PLUGIN}}/evals'
  # The plugin's slash-command prefix (go-ldd, ldd, py-ldd). Case prompts and
  # graders carry the token {{cmd_prefix}}; the cases task writes the real
  # prefix into the copy under EVALS_DIR. Default: read from the plugin's own
  # commands directory, so a run against another plugin built from the same
  # core needs only PLUGIN=<dir>; CMD_PREFIX=<prefix> on the command line wins.
  CMD_PREFIX:
    sh: '{{if .CMD_PREFIX}}printf %s {{.CMD_PREFIX | shellQuote}}{{else}}ls {{.PLUGIN | shellQuote}}/commands | sed -n "s/-review\\.md$//p"{{end}}'

tasks:
  cases:
    desc: Copy the suite into <plugin>/evals (ignored there) so cases sit below the plugin
    cmds:
      - mkdir -p {{.EVALS_DIR}}
      # Clear the copy first: rsync --delete with several sources leaves files the
      # sources do not name, so a plugin that both suites measure (the generic one)
      # would keep the other suite's graders beside this one's. The README stays.
      - find {{.EVALS_DIR}} -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +
      - rsync -a --delete --exclude=/README.md go/cases/ go/scaffold go/postcheck go/fixture {{.EVALS_DIR}}/
      - bash scripts/set-cmd-prefix.sh {{.EVALS_DIR}} {{.CMD_PREFIX}}

  manifest:
    desc: Check violations.yaml against the fixture
    cmds:
      - bash go/check-manifest.sh go/violations.yaml go/fixture/go-mini

  graders:
    desc: Regenerate the review-full recall, cluster and precision graders from the manifest
    cmds:
      - bash go/gen-review-graders.sh go/violations.yaml go/cases/review-full/graders

  run:
    desc: Run one tier (TIER, CAP, MODEL, OUT, CASE, RESUME) against PLUGIN. Spends money.
    deps: [':build', cases]
    cmds:
      - >-
        bin/ldd-eval run --tag {{.TIER}} --model {{.MODEL}} --max-cost-usd {{.CAP}}
        --keep-temp --plugin-dir {{.PLUGIN}} --out {{.OUT}}/{{.TIER}} {{.CASE_FLAG}} {{.RESUME_FLAG}} {{.EVALS_DIR}}

  regrade:
    desc: Re-apply the current graders to the traces under OUT/<TIER>. Free except llm judges.
    deps: [':build', cases]
    cmds:
      - >-
        bin/ldd-eval regrade --tag {{.TIER}} --out {{.OUT}}/{{.TIER}} {{.CASE_FLAG}} {{.EVALS_DIR}}

  baseline:
    desc: Promote the run under OUT to baselines/go-<plugin version>-<plugin sha> (NAME=<dir> overrides, e.g. generic-gomini-0.1.0-<sha>)
    cmds:
      - '{{if .NAME}}BASELINE_NAME={{.NAME | shellQuote}} {{end}}bash scripts/promote-baseline.sh {{.OUT}} {{.PLUGIN}}'
