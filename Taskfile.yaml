version: '3'

includes:
  go:
    taskfile: go/Taskfile.yaml

vars:
  # Path to the go-linter-driven-development plugin directory this run measures.
  PLUGIN: '{{.PLUGIN | default (printf "%s/../ai-coding-rules/go-linter-driven-development" .ROOT_DIR)}}'
  # Agent model. Always pinned on the command line so a baseline names it.
  MODEL: '{{.MODEL | default "claude-sonnet-5"}}'

tasks:
  build:
    desc: Build the runner into bin/ldd-eval
    cmds:
      - cd runner && go build -o ../bin/ldd-eval .
    sources:
      - runner/**/*.go
      - runner/go.mod
      - runner/go.sum
    generates:
      - bin/ldd-eval

  test:
    desc: Run the runner's tests
    cmds:
      - cd runner && go test ./...

  lint:
    desc: Lint the runner
    cmds:
      - cd runner && golangci-lint run ./...

  docs:check:
    desc: Run the plugin's documentation conformance gate over this repository
    cmds:
      - bash scripts/check-docs.sh {{.PLUGIN}}
