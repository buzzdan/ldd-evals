version: '3'

includes:
  go:
    taskfile: go/Taskfile.yaml
    vars:
      PLUGIN: '{{.GO_PLUGIN}}'
  py:
    taskfile: py/Taskfile.yaml
    vars:
      PLUGIN: '{{.PY_PLUGIN}}'

vars:
  # Path to the plugin directory a run measures. PLUGIN on the command line
  # wins for either suite; otherwise each suite defaults to its own plugin in a
  # sibling checkout of buzzdan/ai-coding-rules.
  GO_PLUGIN: '{{.PLUGIN | default (printf "%s/../ai-coding-rules/go-linter-driven-development" .ROOT_DIR)}}'
  PY_PLUGIN: '{{.PLUGIN | default (printf "%s/../ai-coding-rules/python-linter-driven-development" .ROOT_DIR)}}'
  # Agent model. Always pinned on the command line so a baseline names it.
  MODEL: '{{.MODEL | default "claude-sonnet-5"}}'

tasks:
  build:
    desc: Build the runner into bin/ldd-eval
    cmds:
      - cd runner && go build -o ../bin/ldd-eval .
    sources:
      - runner/**/*.go
      - runner/go.mod
      - runner/go.sum
    generates:
      - bin/ldd-eval

  test:
    desc: Run the runner's tests
    cmds:
      - cd runner && go test ./...

  lint:
    desc: Lint the runner
    cmds:
      - cd runner && golangci-lint run ./...

  docs:check:
    desc: Run the Go plugin's documentation conformance gate over this repository
    cmds:
      - bash scripts/check-docs.sh {{.GO_PLUGIN}}
