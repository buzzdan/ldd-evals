    refactor: { gone: 'CONFIG\.', count_max: 0, scope: 'internal/services/' }

# No race detector in Python; the evidence is the code: the request thread
# writes last_seen while the flush thread iterates and deletes, no lock.
- id: R10.Q3.last-seen-race
