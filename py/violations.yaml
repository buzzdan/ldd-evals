  case: F
  questions: [Q6]
  files: [internal/pool/test_workers.py]
  anchor: 'env\.CONFIG\.num_workers = 2'
  expect:
    review:   { category: "🔴", fix: "Extract Clean Island" }
    refactor: { gone: 'CONFIG\.\w+ =', count_max: 0, scope: 'test_\w+\.py', present: '(workers|num_workers)=2|start\([a-z_]+, 2\)' }

