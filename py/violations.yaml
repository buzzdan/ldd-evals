# Go manufactured `context.Background()` in library code. Python has no ctx to
# thread, so the disease changes: library modules configure the process-wide
# root logger at import (`logging.basicConfig`) instead of receiving a logger
# from the composition root. Same rule (R8), question Q3 by analogy: library
# code reaching for process-global state the caller should hand it.
- id: R8.Q3.context-background-in-service
  rule: R8
  questions: [Q3]
  files: [internal/services/device_service.py, internal/services/sync_service.py, internal/jobs/registry.py]
  anchor: '^logging\.basicConfig\('
  expect:
    review:   { category: "🔴", fix: "Push the Global Up One Level" }
    refactor: { gone: '^logging\.basicConfig\(', count_max: 0, scope: 'internal/', present: 'logging\.basicConfig\(' }

