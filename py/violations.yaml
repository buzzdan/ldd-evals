  questions: [Q3]
  files: [internal/services/device_service.py]
  anchor: 'self\.last_seen\[device_id\] ='
  expect:
    review:   { category: "🐛", fix: "Extract Synchronized Owner", evidence: "written from the request thread, iterated by _flush_loop, no lock" }
    refactor: { guarded: true }
    lint:     { linter: "-", route: R10, note: "no race detector for Python" }

