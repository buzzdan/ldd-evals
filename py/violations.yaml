# ─── Case F — a global reached from every layer ─────────────────────────────

# The global is a module-level Configuration object, rebound by load() through
# a `global` statement (PLW0603, the one ruff rule that sees it) and mutated
# in place by a test.
- id: CASE-F.env-config-global
  rule: R8
  case: F
  questions: [Q1]
  files: [internal/env/env.py]
  anchor: '^CONFIG = Configuration\(\)'
  # Reports name this plant by its symbol as often as by its file.
  recall_match: 'env\.py|env\.CONFIG|\bCONFIG\b'
  expect:
    review:   { category: "🔴", fix: "Extract Clean Island", nolint_finding: true }
    refactor: { gone: '^(CONFIG|_region)\b', count_max: 0, scope: 'internal/env/', present: 'def load\(\) -> Configuration:' }
    lint:     { linter: PLW0603, route: R8 }
    prepare:  { gate: MULTIPLY, spec: per-tenant-worker-limit }

- id: CASE-F.deep-reads
  rule: R8
  case: F
  questions: [Q5]
  files: [internal/pool/workers.py, internal/jobs/scheduler.py]
  anchor: 'CONFIG\.(num_workers|batch_size)'
  expect:
    review:   { category: "🔴", fix: "Extract Clean Island", then: "Push the Global Up One Level" }
    refactor: { gone: 'from internal\.env import env', count_max: 1, ratchet: "env.CONFIG refs outside cmd/ non-increasing per commit, reaching 0" }
    shallow_fix_rejected: { gone: '\bConfiguration\b', count_max: 0, scope: 'internal/(pool|jobs|handlers)/' }

# Go's payoff was `t.Parallel()`; Python's is the worker count handed to the
# pool as a literal instead of written into the module global.
- id: CASE-F.test-mutates-global
