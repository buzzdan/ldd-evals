[project]
name = "py-mini"
version = "0.1.0"
description = "Backend for the device fleet"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["internal", "svc"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["internal", "svc"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "RET", "PL", "C90",
  "ARG", "FBT", "BLE", "S", "PGH", "RUF", "DTZ", "T20", "ERA",
]
ignore = ["D105", "D107", "S104", "S310", "S311"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "D", "PLR2004", "PLR0913", "ARG", "FBT"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "float", "bytes"]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true
