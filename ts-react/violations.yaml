  expect:
    review:   { category: "🟡", cluster: "processHeartbeat", fix: "Extract Function named after the comment", critic: "DELETE → route R3" }
    refactor: { gone: '// (parse the line|look up or create device|transitions)$', count_max: 0 }

# Go deduped with a labeled `continue outer`; TypeScript has labels but nobody
# uses them, so the same dedupe is a nested for with a `dup` flag and a break.
# Same disease (a loop the collection type should own), R3 Q4.
- id: R3.Q4.labeled-continue-dedupe
  rule: R3
  questions: [Q4]
  files: [src/pages/Heartbeats/heartbeatFeed.ts]
  anchor: 'break // already added\. skip'
  expect:
    review:   { category: "🟡", fix: "Extract Leaf Type" }
    refactor: { gone: 'break // already added\. skip', count_max: 0, present: '^(export )?(class|type|interface) Tags\b' }

