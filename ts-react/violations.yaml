# violations.yaml — every plant and every control in fixture/ts-react-mini,
# anchored by file + a stable ERE. check-manifest.sh asserts each anchor matches
# at least one line in EACH listed file (paths relative to fixture/ts-react-mini).
#
# ts-react-mini is go-mini seen from the React frontend that talks to the same
# fleet service: the same 156 ids as go/violations.yaml in the same order, so the
# parity report reads one rule at a time across three fixtures, plus a block of
# React-only ids at the end. Where a Go idiom has no TypeScript twin, the plant
# is the nearest disease the same rule catches, and a comment on the entry says
# so.
#
# Id scheme
#   <Rule>.<Question>.<slug>   a plant; the question is the rule's falsifying
#                              question it trips (Qn), `critic` for comment-critic
#                              plants, `lint` for mechanical lint-fixer plants
#                              (FIX class — carried by a rule for counting only),
#                              `react` for the ids only this fixture has.
#   CTRL.<Rule>.<slug>         a control: healthy code that must yield 0 findings.
#   CASE-<A..F>.<slug>         a logic-hunter case member; `rule:` is the primary
#                              rule the case grades, `case:` names the case.
#
# expect.review   category (🐛 Bugs · 🔴 Design Debt · 🟡 Readability Debt ·
#                 🟢 Polish) + the fix move named in the rule's Fix pattern.
# expect.refactor `gone` regex with count_max over the tree after the fix,
#                 `present` regex that must appear; `scope` narrows the grep.
# expect.lint     the ESLint rule id that fires in the red-lint scaffold and the
#                 rule the lint-fixer must route it to (`action: FIX` =
#                 mechanical). `linter: "-"` records that no configured ESLint
#                 rule fires for this plant; the review hunters own it alone.
# expect.prepare  the PREPARE gate this plant trips for the named spec.
#
# Controls carry two extra line-oriented keys read by
# gen-review-graders.sh (the review-full precision graders):
#   symbol: '<ERE>'     the control's distinguishing symbol; a Review report
#                       that mentions it has flagged the control (false positive)
#   mention_ok: true    a correct report legitimately names this symbol (as the
#                       reuse target or the fix), so no precision grader is
#                       generated; default: not mentioned.
#   precision: finding  keeps the grader but moves the line: the report may name
#                       the symbol (an existing type to wire in, say) and fails
#                       only when one of the control's files is cited as a
#                       finding location, tenant.ts:NN with a line number. For a
#                       control that a correct report cites as the fix route
#                       while a wrong one re-proposes it.
# A plant with a review cluster may carry one more:
#   cluster_match: '<ERE>'  replaces the generated cluster grader's default
#                       pattern (the word "cluster", then the anchor or its
#                       last dotted segment on the same line) when reports
#                       spell the cluster in more than one way.
# A plant with expect.review may carry:
#   recall_match: '<ERE>'   replaces the generated recall grader's basename
#                       pattern for the plant's file set when reports name
#                       the plant another way (CONFIG for env.ts).
#
# Line-oriented on purpose: `files:` is a one-line flow list, `anchor:` is one
# single-quoted line, and the parsers only read id / rule / control / files /
# anchor (+ symbol / mention_ok / precision on controls, cluster_match on
# clustered plants). Keep it that way.
#
# Lint in TypeScript is two tools. `task lint` is `tsc -b` + `eslint .` +
# `prettier --check .`; every plant is silenced with
# `// eslint-disable-next-line <rule> -- TODO` (or the `-line` form) for ESLint
# and `// @ts-expect-error TODO` for tsc, and scaffold/red-lint.sh strips both.
# One plant cannot be silenced that way: sonarjs/max-lines reports at line 0,
# before any directive, so heartbeatFeed.ts carries a file-level configuration
# comment (`/* eslint sonarjs/max-lines: "off" -- TODO */`) that red-lint.sh
# strips as well. ESLint has no duplicate-code rule across files, no positional
# boolean rule, no import-time side-effect rule, no exhaustiveness rule unless
# switch-exhaustiveness-check is configured (it is not), and no race detector:
# those plants say `linter: "-"` and are review-only.

# ─── The centerpiece: processHeartbeat ───────────────────────────────────────

- id: R3.Q1.process-heartbeat
  rule: R3
  questions: [Q1, Q3, Q5]
  files: [src/pages/Heartbeats/heartbeatFeed.ts]
  anchor: '^export async function processHeartbeat\('
  expect:
    review:   { category: "🟡", cluster: "processHeartbeat", fix: "Extract Function named after the comment" }
    refactor: { gone: 'attempt < NOTIFY_ATTEMPTS', count_max: 0, present: 'function parse\w*(Heartbeat|Line)\w*\(|static (parse|fromLine)\(' }
    lint:     { linter: sonarjs/cognitive-complexity, route: R3, also: [sonarjs/cyclomatic-complexity, sonarjs/nested-control-flow] }
    postcheck: { cognitive_max: 15, cyclomatic_max: 10 }

# The parser twin (parseLine + normalizeTags) lives in the same file as the
