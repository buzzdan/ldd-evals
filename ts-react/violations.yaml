# Go manufactured `context.Background()` in library code. TypeScript has no ctx
# to thread, so the disease changes: a service conjures its own QueryClient (an
# invalidation root nothing above it owns) and its own AbortController (a
# cancellation root that severs the caller's). Same rule (R8), question Q3.
- id: R8.Q3.context-background-in-service
  rule: R8
  questions: [Q3]
  files: [src/services/syncService.ts, src/services/notify.ts, src/utils/apiQueryClient.ts]
  anchor: 'new QueryClient\(\)|new AbortController\(\)'
  expect:
    review:   { category: "🔴", fix: "Push the Global Up One Level" }
    refactor: { gone: 'new QueryClient\(\)', count_max: 0, scope: 'src/(services|utils)/' }

- id: R8.Q5.flap-window-from-service
  rule: R8
  questions: [Q5]
  files: [src/pages/Heartbeats/heartbeatFeed.ts, src/services/snapshotService.ts]
  anchor: 'CONFIG\.(flapWindowSec|batchSize)'
  expect:
    review:   { category: "🔴", fix: "Push the Global Up One Level" }
    refactor: { gone: 'CONFIG\.', count_max: 0, scope: 'src/(services|pages/Heartbeats)/' }

# No race detector and no threads: the race is the out-of-order response. Two
# searches in flight, the older one resolving last and winning, no ignore flag
# set in the cleanup and no abort.
- id: R10.Q3.last-seen-race
  rule: R10
  questions: [Q3]
  files: [src/hooks/useDeviceSearch.ts]
  anchor: 'setResults\(devices\.filter'
  expect:
    review:   { category: "🐛", fix: "Extract Synchronized Owner", evidence: "the effect re-runs per keystroke; nothing ignores or aborts the previous request" }
    refactor: { guarded: true }
    lint:     { linter: "-", route: R10, note: "no race detector for TypeScript" }

# `goto retry` became a `for (;;)` retry with a counter and `continue`; the
# awaited setTimeout between attempts is the same Q5 disease. Kept inside
# processHeartbeat (not notify.ts) so the oracle's retries stay on the
# centerpiece path, as they are in go-mini and py-mini.
- id: R10.Q5.goto-sleep-backoff
  rule: R10
  questions: [Q5]
  files: [src/pages/Heartbeats/heartbeatFeed.ts]
  anchor: 'setTimeout\(resolve, attempt \* BACKOFF_STEP_MS\)'
  expect:
    review:   { category: "🔴", cluster: "processHeartbeat", fix: "Replace Sleep with Cancellable Wait" }
    refactor: { gone: 'setTimeout\(resolve, attempt \* BACKOFF_STEP_MS\)', count_max: 0 }

